name: CD

on:
  worflow_run:
  types: [complete]
  branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion =='success' }}
    runs-on: ubuntu-latest
    steps:
     - uses:   /ssh-action@v1
        with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        scripst: |
          if [ ! -d ~/devops-project ]; then
           git clone ${{ github.server_url }}/${{ github.repository }}.git ~/devops-project
        fi
        cd ~/devops-project
        git pull origin main 
        if [ ! -f .env ]; then
          echo "ERROR: ~/devops-project/.env is missing Create it once with DOCKERHUB_USERNAME and DB credentials."
            exit 1
        fi
        docker compose pull 
        docker compose up -d
        docker image prune -f
    
